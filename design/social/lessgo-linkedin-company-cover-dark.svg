<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191" role="img" aria-labelledby="title description">
  <title id="title">Lessgo - Hangouts made easy!</title>
  <desc id="description">Dark LinkedIn company cover with the Lessgo logo, an aurora glow, and outlined hangout icons.</desc>
